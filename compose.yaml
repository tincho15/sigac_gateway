services:
  db:
    image: postgres:17-alpine
    container_name: sigac_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigac_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sigac}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - sigac_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: sigac_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigac_user}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigac}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

volumes:
  sigac_db_data: